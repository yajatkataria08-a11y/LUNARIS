<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050714"/>
      <stop offset="50%" stop-color="#0a0f28"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="wavePurple" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Laser Line Gradient -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveMotion1 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0px); }
    }
    @keyframes waveMotion2 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(35px); }
      100% { transform: translateX(0px); }
    }
    @keyframes laserSweepFooter {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: -1200; }
    }
    @keyframes starPulseFooter {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.9; }
    }
    @keyframes beaconExpand {
      0% { r: 3; opacity: 1; }
      100% { r: 24; opacity: 0; }
    }

    .wave-1 { animation: waveMotion1 8s ease-in-out infinite; }
    .wave-2 { animation: waveMotion2 10s ease-in-out infinite; }
    .laser-line-footer { stroke-dasharray: 200 500; animation: laserSweepFooter 7s linear infinite; }
    .star-footer { animation: starPulseFooter 3s ease-in-out infinite; }
    .beacon-footer { animation: beaconExpand 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="200" rx="16" fill="url(#footerBg)"/>

  <!-- Starry Constellation Backdrop -->
  <g fill="#ffffff">
    <circle cx="90" cy="50" r="1.2" class="star-footer"/>
    <circle cx="210" cy="30" r="1.4" class="star-footer" style="animation-delay: 1s;"/>
    <circle cx="340" cy="70" r="1.0" class="star-footer" style="animation-delay: 2s;"/>
    <circle cx="480" cy="40" r="1.5" class="star-footer"/>
    <circle cx="620" cy="60" r="1.2" class="star-footer" style="animation-delay: 1.5s;"/>
    <circle cx="750" cy="35" r="1.4" class="star-footer"/>
    <circle cx="890" cy="55" r="1.1" class="star-footer" style="animation-delay: 0.8s;"/>
    <circle cx="1020" cy="40" r="1.5" class="star-footer"/>
    <circle cx="1130" cy="65" r="1.2" class="star-footer" style="animation-delay: 2.2s;"/>
  </g>

  <!-- Flowing Sine Waves Across Horizon -->
  <g class="wave-1">
    <path d="M -50 140 Q 250 100 550 145 T 1150 135 T 1300 140 L 1300 200 L -50 200 Z" fill="url(#waveCyan)"/>
  </g>
  <g class="wave-2">
    <path d="M -50 155 Q 300 120 650 160 T 1250 145 L 1250 200 L -50 200 Z" fill="url(#wavePurple)"/>
  </g>

  <!-- Central Mission Homage Badge -->
  <g transform="translate(600, 75)">
    <!-- Tricolor Orbital Ring (Homage to ISRO) -->
    <ellipse cx="0" cy="0" rx="42" ry="16" fill="none" stroke="#ff9933" stroke-width="1.2" stroke-dasharray="4 4" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="42" ry="16" fill="none" stroke="#138808" stroke-width="1.2" stroke-dasharray="4 4" transform="rotate(25)"/>
    <circle cx="0" cy="0" r="16" fill="#0c1b3a" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" stroke-width="1" class="beacon-footer"/>

    <!-- Mission Homage Text -->
    <text x="0" y="32" fill="#e2e8f0" font-family="'Cinzel', serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="3">
      LUNARIS // LUNASAFE AI
    </text>
    <text x="0" y="47" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="10" text-anchor="middle" letter-spacing="0.5">
      In Tribute to ISRO SAC · PRL · SPL Planetary Scientists &amp; Chandrayaan Missions
    </text>
  </g>

  <!-- Left Mission Status Telemetry -->
  <g transform="translate(60, 80)">
    <circle cx="8" cy="8" r="4" fill="#22c55e" filter="url(#softGlow)"/>
    <text x="20" y="11" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">STATUS: ALL SYSTEMS NOMINAL</text>
    <text x="0" y="30" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8.5">
      ISRO PRADAN Open Data Federation · MIT License
    </text>
  </g>

  <!-- Right Telemetry Coordinates -->
  <g transform="translate(920, 80)">
    <text x="220" y="11" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="end">
      TARGET: 14.08°N, 303.20°E
    </text>
    <text x="220" y="30" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="end">
      Oceanus Procellarum · Marius Hills Subsurface
    </text>
  </g>

  <!-- Sweeping Bottom Laser Scanline -->
  <line x1="20" y1="192" x2="1180" y2="192" stroke="url(#laserBeam)" stroke-width="2" class="laser-line-footer"/>

  <!-- Corner Tech Accent Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 1188 24 L 1188 12 L 1176 12" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 12 176 L 12 188 L 24 188" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 1188 176 L 1188 188 L 1176 188" fill="none" stroke="#38bdf8" stroke-width="2"/>
</svg>
