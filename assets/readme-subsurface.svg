<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="crossBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060f"/>
      <stop offset="40%" stop-color="#0a0e24"/>
      <stop offset="100%" stop-color="#03040a"/>
    </linearGradient>

    <!-- Basalt Rock Pattern & Gradient -->
    <linearGradient id="basaltRock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="regolithLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Void Interior Chamber Glow -->
    <radialGradient id="voidGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar Pulse Waves -->
    <linearGradient id="radarRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes radarWaveEmit {
      0% { r: 5; opacity: 1; }
      100% { r: 90; opacity: 0; }
    }
    @keyframes rayMarch {
      0% { stroke-dashoffset: 300; }
      100% { stroke-dashoffset: -300; }
    }
    @keyframes cosmicRay {
      0% { transform: translateY(-30px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateY(85px); opacity: 0; }
    }
    @keyframes thermalBreathe {
      0%, 100% { fill-opacity: 0.12; }
      50% { fill-opacity: 0.25; }
    }

    .radar-wave-1 { animation: radarWaveEmit 2.8s cubic-bezier(0.1, 0.7, 0.4, 1) infinite; }
    .radar-wave-2 { animation: radarWaveEmit 2.8s cubic-bezier(0.1, 0.7, 0.4, 1) infinite 1.4s; }
    .laser-ray { stroke-dasharray: 8 12; animation: rayMarch 3s linear infinite; }
    .cosmic-particle-1 { animation: cosmicRay 1.8s ease-in infinite; }
    .cosmic-particle-2 { animation: cosmicRay 2.3s ease-in infinite 0.6s; }
    .cosmic-particle-3 { animation: cosmicRay 1.5s ease-in infinite 1.1s; }
    .thermal-safe-zone { animation: thermalBreathe 4s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#crossBg)"/>

  <!-- Header Banner -->
  <g transform="translate(50, 36)">
    <text x="0" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" letter-spacing="2">
      // SUBSURFACE LAVA TUBE TOMOGRAPHY &amp; GEOMECHANICAL CROSS-SECTION
    </text>
    <text x="0" y="20" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13">
      DFSAR 24cm L-Band polarimetric sounding · Subsurface thermal stability · Radiation attenuation
    </text>
  </g>

  <!-- SATELLITE RADAR SOUNDING SOURCE (Top Center-Left) -->
  <g transform="translate(420, 85)">
    <!-- Satellite Icon -->
    <rect x="-14" y="-10" width="28" height="20" rx="2" fill="#e2e8f0" stroke="#0284c7" stroke-width="1"/>
    <rect x="-11" y="-7" width="22" height="14" fill="#d97706" opacity="0.85"/>
    <line x1="-38" y1="0" x2="-14" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="-38" y="-8" width="24" height="16" fill="#1e3a8a" stroke="#60a5fa" stroke-width="0.8"/>
    <line x1="14" y1="0" x2="38" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="14" y="-8" width="24" height="16" fill="#1e3a8a" stroke="#60a5fa" stroke-width="0.8"/>
    <circle cx="0" cy="10" r="3" fill="#38bdf8" filter="url(#laserGlow)"/>

    <text x="0" y="-16" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">CH-2 DFSAR (λ=24cm)</text>

    <!-- Radar Waves Pulsing Outward -->
    <circle cx="0" cy="10" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" class="radar-wave-1"/>
    <circle cx="0" cy="10" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" class="radar-wave-2"/>
  </g>

  <!-- LUNAR SURFACE TERRAIN PROFILE & CROSS-SECTION -->
  <g transform="translate(0, 150)">
    <!-- 1. Regolith Shielding Layer (0 - 3m depth) -->
    <path d="M 50 25 L 340 25 Q 360 22 375 35 L 390 60 L 510 60 L 525 35 Q 540 22 560 25 L 1150 25 L 1150 40 L 525 40 L 510 60 L 390 60 L 375 40 L 50 40 Z" fill="url(#regolithLayer)"/>

    <!-- 2. Solid Basalt Bedrock Layer (Continuous Roof Vault & Walls) -->
    <!-- Left Rock Mass -->
    <path d="M 50 40 L 375 40 L 390 60 L 395 190 L 150 190 Q 120 185 80 160 L 50 160 Z" fill="url(#basaltRock)" stroke="#475569" stroke-width="0.8"/>
    <!-- Right Rock Mass -->
    <path d="M 525 40 L 1150 40 L 1150 160 L 1120 160 Q 1080 185 1050 190 L 505 190 L 510 60 Z" fill="url(#basaltRock)" stroke="#475569" stroke-width="0.8"/>

    <!-- 3. Lava Tube Subsurface Chamber Void (Interior Cave Vault) -->
    <path d="M 150 190 L 395 190 L 505 190 L 1050 190 L 1050 240 L 150 240 Z" fill="#030712"/>
    <rect x="150" y="190" width="900" height="50" fill="url(#voidGlow)" class="thermal-safe-zone"/>
    <line x1="150" y1="240" x2="1050" y2="240" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Cave Roof Vault Curve (Intact Basalt Ceiling) -->
    <path d="M 150 190 Q 270 170 395 190" fill="none" stroke="#10b981" stroke-width="2.5" filter="url(#laserGlow)"/>
    <path d="M 505 190 Q 775 165 1050 190" fill="none" stroke="#10b981" stroke-width="2.5" filter="url(#laserGlow)"/>

    <!-- Skylight Opening Dimension Lines -->
    <line x1="390" y1="52" x2="510" y2="52" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="390" y1="46" x2="390" y2="58" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="510" y1="46" x2="510" y2="58" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="450" y="47" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">SKYLIGHT COLLAR ⌀ 65m</text>

    <!-- Roof Thickness Callout -->
    <line x1="720" y1="40" x2="720" y2="175" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="720" cy="40" r="3" fill="#38bdf8"/>
    <circle cx="720" cy="175" r="3" fill="#38bdf8"/>
    <g transform="translate(730, 105)">
      <rect x="0" y="0" width="138" height="28" rx="4" fill="#090d21" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="8" y="13" fill="#e0f2fe" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">ROOF THICKNESS: 28m</text>
      <text x="8" y="23" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">FoS &gt; 5.2 (Arch Compressive)</text>
    </g>

    <!-- RADAR DOUBLE-BOUNCE RAY PATHS (m-chi Polarimetry Demonstration) -->
    <!-- Incident Beam down through skylight -->
    <line x1="420" y1="-55" x2="440" y2="235" stroke="#38bdf8" stroke-width="2.5" class="laser-ray" filter="url(#laserGlow)"/>
    <!-- Bounce 1: Floor reflection to vertical wall -->
    <line x1="440" y1="235" x2="395" y2="150" stroke="#818cf8" stroke-width="2.5" class="laser-ray" filter="url(#laserGlow)"/>
    <!-- Bounce 2: Wall reflection back toward orbit -->
    <line x1="395" y1="150" x2="460" y2="-55" stroke="#c084fc" stroke-width="2.2" class="laser-ray" filter="url(#laserGlow)"/>

    <!-- Right-angle symbol at Wall/Floor -->
    <rect x="428" y="222" width="12" height="12" fill="none" stroke="#22c55e" stroke-width="1.2"/>
    <circle cx="434" cy="228" r="1.5" fill="#22c55e"/>
    <text x="448" y="230" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800">m-χ RIGHT-ANGLE DOUBLE BOUNCE</text>

    <!-- THERMAL INVERSION CALLOUTS -->
    <!-- Surface Thermal Extremes (Left Top) -->
    <g transform="translate(100, -25)">
      <rect x="0" y="0" width="170" height="38" rx="6" fill="#18181b" stroke="#f43f5e" stroke-width="1"/>
      <circle cx="14" cy="19" r="4" fill="#f43f5e"/>
      <text x="24" y="16" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">SURFACE EXTREMES:</text>
      <text x="24" y="30" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">+120°C <tspan fill="#94a3b8">DAY</tspan> · –130°C <tspan fill="#94a3b8">NIGHT</tspan></text>
    </g>

    <!-- Subsurface Stable Zone (Inside Cave) -->
    <g transform="translate(560, 202)">
      <rect x="0" y="0" width="235" height="32" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2" filter="url(#laserGlow)"/>
      <circle cx="14" cy="16" r="4" fill="#10b981"/>
      <text x="24" y="15" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SUBTERRANEAN THERMAL HABITAT:</text>
      <text x="24" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">–20°C STEADY <tspan fill="#86efac" font-size="8.5">(ChaSTE In-Situ Confirmed)</tspan></text>
    </g>

    <!-- COSMIC RADIATION DEFLECTION (Top Right) -->
    <g transform="translate(950, -45)">
      <!-- Incident Cosmic Rays deflected by basalt roof -->
      <line x1="-30" y1="0" x2="-10" y2="65" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" class="cosmic-particle-1"/>
      <line x1="0" y1="0" x2="20" y2="65" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" class="cosmic-particle-2"/>
      <line x1="30" y1="0" x2="50" y2="65" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" class="cosmic-particle-3"/>

      <rect x="-40" y="10" width="150" height="32" rx="4" fill="#090d21" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="-32" y="24" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">COSMIC RAY SHIELD</text>
      <text x="-32" y="36" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="8">100% GCR &amp; Micrometeorite Block</text>
    </g>
  </g>

  <!-- Bottom Legend Footer -->
  <g transform="translate(50, 395)">
    <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">
      PHYSICAL BENCHMARKS: Basalt Density ρ = 3200 kg/m³ · UCS = 180 MPa · Regolith Thermal Conductivity k = 0.002 W/m·K (Chandrayaan-3 ChaSTE)
    </text>
  </g>
</svg>
